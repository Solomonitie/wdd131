<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album | WDD 131</title>
    <meta name="description" content="A responsive picture album showcasing temples from around the world.">
    <meta name="author" content="Solomon Itie">

    <!-- Google Fonts: Roboto & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Mobile-First CSS Links -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="screen and (min-width: 37.5em)">

    <!-- Deferred JavaScript -->
    <script src="scripts/temples.js" defer></script>
</head>

<body>
    <header>
        <span class="site-title">Temple Album</span>
        <button id="menu-button" aria-label="Toggle Navigation Menu"></button>
        <nav>
            <ul class="navigation">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Large</a></li>
                <li><a href="#">Small</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Home</h1>
        <div class="gallery">
            <figure>
                <img src="images/aba-nigeria-temple.jpg" alt="Aba Temple" loading="lazy" width="400" height="250">
                <figcaption>Aba Nigeria</figcaption>
            </figure>
            <figure>
                <img src="images/aspia-temple.jpeg" alt="Aspia regional Temple" loading="lazy" width="400" height="250">
                <figcaption>Aspia</figcaption>
            </figure>
            <figure>
                <img src="images/accra-ghana-temple.jpg" alt="Accra Ghana regional Temple" loading="lazy" width="400"
                    height="250">
                <figcaption>Accra Ghana</figcaption>
            </figure>
            <figure>
                <img src="images/peru-temple.jpg" alt="Peru regional Temple" loading="lazy" width="400" height="250">
                <figcaption>Peru</figcaption>
            </figure>
            <figure>
                <img src="images/Columblia-temple.jpg" alt="Columblia three Temple" loading="lazy" width="400"
                    height="250">
                <figcaption>Columblia</figcaption>
            </figure>
            <figure>
                <img src="images/adelaide-australia-temple.jpg" alt="Adelaide Temple" loading="lazy" width="400"
                    height="250">
                <figcaption>Adelaide Australia</figcaption>
            </figure>
            <figure>
                <img src="images/albuquerque-temple.jpg" alt="Albuquerque Utah Temple" loading="lazy" width="400"
                    height="250">
                <figcaption>Albuquerque Utah</figcaption>
            </figure>
            <figure>
                <img src="images/anchorage-temple.jpg" alt="Anchorage Alaska Temple" loading="lazy" width="400"
                    height="250">
                <figcaption>Anchorage Alaska</figcaption>
            </figure>
            <figure>
                <img src="images/asung-temple.jpeg" alt="Johannesburg South Africa Temple" loading="lazy" width="400"
                    height="250">
                <figcaption>Johannesburg South Africa</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> | Solomon Itie | Lagos, Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
